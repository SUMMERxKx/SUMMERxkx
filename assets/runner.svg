<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="a little runner">
  <style>
    .body { stroke: #8a8f98; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .head { fill: #8a8f98; }
    .track { stroke: #ff7a1a; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 18 14; animation: run-track 0.6s linear infinite; }
    .bob { animation: bob 0.3s ease-in-out infinite alternate; }
    .leg-a, .arm-b { transform-origin: 100px 112px; animation: swing 0.6s ease-in-out infinite alternate; }
    .leg-b, .arm-a { transform-origin: 100px 112px; animation: swing 0.6s ease-in-out infinite alternate-reverse; }
    .arm-a, .arm-b { transform-origin: 100px 72px; }
    @keyframes swing { from { transform: rotate(-32deg); } to { transform: rotate(32deg); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes run-track { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 32; } }
  </style>
  <line class="track" x1="20" y1="164" x2="180" y2="164" />
  <g class="bob">
    <circle class="head" cx="108" cy="46" r="13" />
    <path class="body" d="M104 64 L100 112" />
    <path class="body arm-a" d="M101 74 L88 96 L100 108" />
    <path class="body arm-b" d="M101 74 L116 94 L130 86" />
    <path class="body leg-a" d="M100 112 L112 142 L104 170" />
    <path class="body leg-b" d="M100 112 L86 140 L70 156" />
  </g>
</svg>
